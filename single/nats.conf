# Один сервер NATS с включённым JetStream.
# Структура повторяет конфигурацию со слайда 14, плюс блок jetstream.

server_name: demo
port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 1GB
}

authorization {
  users: [
    { user: demo, password: secret }
  ]
}
